[project]
name = "shopify-client-base"
version = "0.1.0"
description = "Shopify Admin GraphQL + Google Drive/Sheets client used to manage Shopify stores."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "google-api-python-client>=2.188.0",
    "google-auth>=2.0",
    "gspread>=6.2.1",
    "matplotlib>=3.10.8",
    "numpy>=2.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pillow>=12.0.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
